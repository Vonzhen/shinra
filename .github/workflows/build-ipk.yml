name: Verify Shinra on OpenWrt

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev, master ]
  workflow_dispatch:

jobs:
  static:
    name: Static Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Provision Static Tools
        run: sudo apt-get update && sudo apt-get install -y python3-yaml

      - name: Validate Source Files
        run: bash ./tests/ci-static.sh

  build:
    name: Assemble Packages
    runs-on: ubuntu-latest
    needs: static
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Package Release
        run: |
          sed -i "s/^PKG_RELEASE:=.*/PKG_RELEASE:=${GITHUB_RUN_NUMBER}/" luci-app-shinra/Makefile
          grep '^PKG_RELEASE:=' luci-app-shinra/Makefile

      - name: Provision Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gettext
          wget https://raw.githubusercontent.com/openwrt/openwrt/master/scripts/ipkg-build -O /usr/local/bin/ipkg-build
          chmod +x /usr/local/bin/ipkg-build

      - name: Build IPK Package
        run: bash ./scripts/build.sh ipk

      - name: Build APK Package
        env:
          APK_SIGNING_KEY_B64: ${{ secrets.APK_SIGNING_KEY_B64 }}
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -e APK_SIGNING_KEY_B64 \
            -w /work \
            alpine:latest \
            sh -lc 'apk add --no-cache bash apk-tools coreutils findutils sed grep ca-certificates && if [ -n "$APK_SIGNING_KEY_B64" ]; then mkdir -p build/signing && printf "%s" "$APK_SIGNING_KEY_B64" | base64 -d > build/signing/shinra.rsa && chmod 0600 build/signing/shinra.rsa && export APK_SIGNING_KEY=/work/build/signing/shinra.rsa; fi && bash ./scripts/build.sh apk'

      - name: Upload IPK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shinra-ipk-${{ github.sha }}
          path: '*.ipk'
          if-no-files-found: error
          retention-days: 7

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shinra-apk-${{ github.sha }}
          path: '*.apk'
          if-no-files-found: error
          retention-days: 7
