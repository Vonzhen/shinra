name: Verify Shinra on OpenWrt

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev, master ]
  workflow_dispatch:

jobs:
  static:
    name: Static Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Provision Static Tools
        run: sudo apt-get update && sudo apt-get install -y python3-yaml

      - name: Validate Source Files
        run: bash ./tests/ci-static.sh

  build:
    name: Assemble Packages
    runs-on: ubuntu-latest
    needs: static
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Package Release
        run: |
          sed -i "s/^PKG_RELEASE:=.*/PKG_RELEASE:=${GITHUB_RUN_NUMBER}/" luci-app-shinra/Makefile
          grep '^PKG_RELEASE:=' luci-app-shinra/Makefile

      - name: Provision Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gettext
          wget https://raw.githubusercontent.com/openwrt/openwrt/master/scripts/ipkg-build -O /usr/local/bin/ipkg-build
          chmod +x /usr/local/bin/ipkg-build

      - name: Build IPK Package
        run: bash ./scripts/build.sh ipk

      - name: Build APK Package
        env:
          APK_SIGNING_KEY_B64: ${{ secrets.APK_SIGNING_KEY_B64 }}
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -e APK_SIGNING_KEY_B64 \
            -w /work \
            alpine:latest \
            sh -lc 'apk add --no-cache bash apk-tools coreutils findutils sed grep ca-certificates && if [ -n "$APK_SIGNING_KEY_B64" ]; then mkdir -p build/signing && printf "%s" "$APK_SIGNING_KEY_B64" | base64 -d > build/signing/shinra.rsa && chmod 0600 build/signing/shinra.rsa && export APK_SIGNING_KEY=/work/build/signing/shinra.rsa; fi && bash ./scripts/build.sh apk'

      - name: Upload IPK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shinra-ipk-${{ github.sha }}
          path: '*.ipk'
          if-no-files-found: error
          retention-days: 7

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shinra-apk-${{ github.sha }}
          path: '*.apk'
          if-no-files-found: error
          retention-days: 7

  openwrt-apk-integration:
    name: OpenWrt 25.12 APK Integration
    runs-on: ubuntu-latest
    needs: build
    env:
      OPENWRT_VERSION: 25.12.4
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: shinra-apk-${{ github.sha }}
          path: test-artifacts

      - name: Install and Verify APK in OpenWrt
        shell: bash
        run: |
          set +e
          set -o pipefail
          bash ./tests/openwrt-apk-integration.sh ./test-artifacts/luci-app-shinra_*.apk 2>&1 | tee /tmp/openwrt-apk-integration.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do
              echo "::error title=OpenWrt APK Integration::$line"
            done < <(tail -n 40 /tmp/openwrt-apk-integration.log)
          fi
          exit "$status"

      - name: Summarize OpenWrt Integration Log
        if: always()
        shell: bash
        run: |
          {
            echo '## OpenWrt APK Integration Log'
            echo
            echo '```text'
            tail -n 160 /tmp/openwrt-apk-integration.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
