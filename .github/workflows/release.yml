name: Release Shinra Packages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and Publish Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Release Tag
        uses: actions/checkout@v4

      - name: Set Package Version from Tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          case "$VERSION" in
            ''|*[!0-9A-Za-z._-]*)
              echo "Unsupported release tag: ${GITHUB_REF_NAME}" >&2
              exit 1
              ;;
          esac
          sed -i "s/^PKG_VERSION:=.*/PKG_VERSION:=${VERSION}/" luci-app-shinra/Makefile
          sed -i 's/^PKG_RELEASE:=.*/PKG_RELEASE:=1/' luci-app-shinra/Makefile
          grep '^PKG_\(VERSION\|RELEASE\):=' luci-app-shinra/Makefile

      - name: Provision Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gettext
          wget https://raw.githubusercontent.com/openwrt/openwrt/master/scripts/ipkg-build -O /usr/local/bin/ipkg-build
          chmod +x /usr/local/bin/ipkg-build

      - name: Build IPK Package
        run: bash ./scripts/build.sh ipk

      - name: Build APK Package
        env:
          APK_SIGNING_KEY_B64: ${{ secrets.APK_SIGNING_KEY_B64 }}
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -e APK_SIGNING_KEY_B64 \
            -w /work \
            alpine:latest \
            sh -lc 'apk add --no-cache bash apk-tools coreutils findutils sed grep ca-certificates && if [ -n "$APK_SIGNING_KEY_B64" ]; then mkdir -p build/signing && printf "%s" "$APK_SIGNING_KEY_B64" | base64 -d > build/signing/shinra.rsa && chmod 0600 build/signing/shinra.rsa && export APK_SIGNING_KEY=/work/build/signing/shinra.rsa; fi && bash ./scripts/build.sh apk'

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            *.ipk
            *.apk
          fail_on_unmatched_files: true
